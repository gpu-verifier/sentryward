name: Release to PyPI

# Builds the sdist and per-platform wheels for every published GitHub release
# (or a manual run), then uploads them with PyPI trusted publishing. A manual
# run builds artifacts only unless an upload destination is selected.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Upload destination
        type: choice
        options: [none, testpypi, pypi]
        default: none

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - name: Check source package boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          for archive in Path("dist").glob("*.tar.gz"):
              with tarfile.open(archive) as package:
                  paths = [Path(*Path(name).parts[1:]) for name in package.getnames()]
              excluded = {"tests", "references", "tools", "skills", "build", "corpus", "examples"}
              unexpected = [str(path) for path in paths if path.parts and path.parts[0] in excluded]
              unexpected += [str(path) for path in paths
                             if path.name.endswith(("_test.cpp", "_tests.hpp"))
                             or "__pycache__" in path.parts]
              assert not unexpected, unexpected
          PY
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-14
            deployment_target: "14.0"
    env:
      # Homebrew's libcrypto and libz3 target the runner's macOS release.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.23.3
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheels]
    if: github.event_name == 'release' || inputs.repository != 'none'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'release' || inputs.repository == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - if: github.event_name == 'release' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
      - if: github.event_name != 'release' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
